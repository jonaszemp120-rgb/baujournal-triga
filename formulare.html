<body data-bereich="formulare">

  <div class="tr-kopf nur-desktop">
    <h1>Formulare</h1>
  </div>

  <div class="br-kopf nur-mobil">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <a href="start.html" class="br-knopf pressable" aria-label="Zurück zur Startseite">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <div style="font-weight:700; font-size:17px;">Formulare</div>
    </div>
    <button type="button" class="br-knopf pressable" data-neu aria-label="Neuer Antrag">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="hinweis" hidden style="margin:12px 16px 0; background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

  <div class="fm-flaeche">
    <!-- Desktop: das Formular steht fest in der linken Spalte. -->
    <div class="fm-spalte-form">
      <h2>Neuer Antrag</h2>
      <div id="form-fest"></div>
    </div>

    <div class="fm-spalte-liste">
      <div id="offene"></div>
      <div class="fm-label">Meine Anträge</div>
      <div id="meine"></div>
    </div>
  </div>
