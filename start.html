<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Handy: navy Begrüssungszeile, darunter das Kachelraster.
     Desktop: die weisse Kopfzeile der Shell, darunter Karten in einer Reihe. */
  .st-gruss{
    background:var(--navy);
    padding:calc(20px + env(safe-area-inset-top)) 20px 16px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  }
  .st-raster{
    padding:16px 20px calc(24px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px;
  }
  .st-kachel{
    /* box-sizing steht in dieser App nicht global auf border-box, sonst
       würde min-height auf die Innenbox wirken und die Kachel um Polster
       und Rahmen zu hoch geraten. */
    box-sizing:border-box;
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:20px 16px; display:flex; flex-direction:column; gap:14px;
    min-height:150px; color:var(--text);
  }
  .st-kachel .symbol{
    width:44px; height:44px; border-radius:12px; background:var(--navy);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .st-kachel .zahl{ display:none; }
  .tr-banner{ margin:12px 20px 0; }

  /* Der Einstieg in den Feed, nur auf dem Handy. Bewusst eine Zeile und
     keine Kachel: das Raster soll die sechs Bereiche zeigen, die im
     Design abgebildet sind. */
  .st-feed{
    display:flex; align-items:center; gap:12px;
    margin:16px 20px 0; padding:13px 14px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    color:var(--text);
  }
  .st-feed .symbol{
    width:36px; height:36px; border-radius:10px; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .st-feed .wort{ flex:1; min-width:0; }
  .st-feed .titel{ display:block; font-weight:700; font-size:15px; }
  .st-feed .unter{ display:block; color:var(--text-dim); font-size:12px; margin-top:1px; }
  .st-feed svg:last-child{ color:var(--text-dim); flex-shrink:0; }

  @media (min-width:1024px){
    .st-gruss{ display:none; }
    .tr-banner{ margin:0 0 20px; }
    .st-raster{
      padding:28px 40px 36px;
      /* Sechs Bereiche in einer Reihe, solange der Platz reicht; darunter
         bricht die Reihe um, statt die Kacheln zu quetschen. */
      grid-template-columns:repeat(auto-fit, minmax(158px, 1fr)); gap:16px;
    }
    .st-kopfzeile{ padding:28px 40px 0; }
    .st-kopfzeile .gruss{ font-size:24px; font-weight:800; }
    .st-kopfzeile .datum{ color:var(--text-dim); font-size:14px; margin-top:4px; }
    .st-kachel{
      border-radius:16px; padding:24px; gap:16px; min-height:0;
      transition:border-color .12s ease, box-shadow .12s ease;
    }
    .st-kachel:hover{ border-color:var(--navy); box-shadow:0 6px 20px rgba(0,16,30,.08); }
    .st-kachel .symbol{ width:42px; height:42px; border-radius:11px; }
    .st-kachel .kopf{ display:flex; align-items:center; justify-content:space-between; }
    .st-kachel .zahl{ display:block; font-size:28px; font-weight:800; color:var(--navy); }
  }
</style>
</head>
<body data-bereich="">

  <div class="tr-kopf nur-desktop"><h1>Startseite</h1></div>

  <div class="st-gruss nur-mobil">
    <div style="min-width:0;">
      <div style="color:rgba(255,255,255,0.6); font-size:12px; font-weight:500;">Guten Tag</div>
      <div id="m-name" style="color:#fff; font-size:19px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">…</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
      <a href="suche.html" class="pressable" aria-label="Alles durchsuchen" style="width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; display:flex; align-items:center; justify-content:center;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </a>
      <button id="konto" class="pressable" aria-label="Konto" style="width:38px; height:38px; border:none; border-radius:50%; background:var(--red); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;">–</button>
    </div>
  </div>

  <div id="banner-mobil" class="nur-mobil"></div>

  <div id="feed-einstieg" class="nur-mobil"></div>

  <div class="st-kopfzeile nur-desktop">
    <div id="banner-desktop"></div>
    <div class="gruss" id="d-gruss">Guten Tag</div>
    <div class="datum" id="d-datum"></div>
  </div>

  <div id="raster" class="st-raster"></div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/start.js"></script>
</body>
</html>
