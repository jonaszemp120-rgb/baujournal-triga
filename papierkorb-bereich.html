<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papierkorb · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<style>
  .pk-tabelle{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .pk-kopf{ display:none; }
  .pk-zeile{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:14px 18px; border-bottom:1px solid var(--border);
  }
  .pk-zeile:last-child{ border-bottom:none; }
  .pk-name{ flex:1; min-width:0; font-weight:600; font-size:14px; color:var(--text-dim); overflow-wrap:anywhere; }
  .pk-wann, .pk-wer{ color:var(--mute); font-size:12.5px; }
  .pk-zurueck{
    display:flex; align-items:center; gap:8px;
    background:var(--bg); color:var(--navy); border:none;
    padding:9px 16px; border-radius:20px; font-weight:700; font-size:12.5px;
  }
  .pk-zurueck:hover{ background:#e3e8ea; }
  @media (min-width:1024px){
    .pk-flaeche{ padding:28px 32px 40px; max-width:1100px; }
    .pk-kopf{
      display:flex; align-items:center; gap:14px;
      padding:12px 18px; background:var(--bg); color:var(--text-dim);
      font-size:11.5px; font-weight:700; letter-spacing:.4px;
    }
    .pk-kopf .pk-name{ color:var(--text-dim); font-weight:700; }
    .pk-zeile{ flex-wrap:nowrap; }
    .pk-wann, .pk-wer{ width:160px; flex-shrink:0; }
  }
  @media (max-width:1023px){
    .pk-flaeche{ padding:16px; }
    .pk-zeile{ gap:4px 14px; }
    .pk-name{ flex-basis:100%; }
  }
</style>
</head>
<body data-bereich="">

  <div class="tr-kopf nur-desktop"><h1 id="d-titel">Papierkorb</h1></div>

  <div class="br-kopf nur-mobil">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <a id="zurueck" href="start.html" class="br-knopf pressable" aria-label="Zurück">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <div id="m-titel" style="font-weight:700; font-size:17px;">Papierkorb</div>
    </div>
  </div>

  <div class="pk-flaeche">
    <div style="font-size:12.5px; color:var(--text-dim); line-height:1.5; margin-bottom:16px; max-width:640px;">
      Nichts wird wirklich gelöscht. Die Einträge sind nur aus der Liste genommen und lassen sich jederzeit zurückholen.
    </div>
    <div id="inhalt"></div>
  </div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/papierkorb-bereich.js"></script>
</body>
</html>
