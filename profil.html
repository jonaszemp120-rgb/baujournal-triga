<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mein Profil · TRIGA App</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Wegen der Marke (.pj-marke) für die Berechtigungsstufe. -->
<link rel="stylesheet" href="css/projekte.css">
<style>
  .pr-flaeche{
    padding:16px 16px calc(28px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:16px; max-width:720px;
  }
  .pr-karte{
    background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:20px;
  }
  .pr-karte h2{ margin:0 0 16px; font-size:16px; font-weight:800; }
  /* Folgt dem Titel ein erklärender Satz, rücken die beiden zusammen —
     sie gehören zusammen, der Abstand gehört unter das Paar. */
  .pr-karte h2 + .unter{ margin:-12px 0 16px; color:var(--text-dim); font-size:12.5px; line-height:1.5; }

  /* Die Kopfkarte: auf dem Handy untereinander und mittig, auf dem
     Desktop in einer Zeile. Ein Markup, zwei Ausrichtungen. */
  .pr-kopfkarte{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; padding:24px 20px;
  }
  .pr-kopfkarte .kreis{
    width:64px; height:64px; border-radius:50%;
    background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; flex-shrink:0;
  }
  .pr-kopfkarte .name{ font-size:19px; font-weight:800; }
  .pr-kopfkarte .rolle{ color:var(--text-dim); font-size:13.5px; }

  .pr-feld{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .pr-feld label{
    font-size:11px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text-dim);
  }
  .pr-feld input{
    height:46px; border-radius:11px; border:1.5px solid var(--border);
    padding:0 14px; font-size:15px; font-weight:600; color:var(--text);
  }
  .pr-hinweis{ color:var(--text-dim); font-size:12.5px; line-height:1.5; margin-bottom:16px; }
  .pr-rot{
    width:100%; height:50px; border:none; border-radius:13px;
    background:var(--red); color:#fff; font-weight:700; font-size:15px;
  }
  .pr-weiss{
    width:100%; height:48px; border-radius:13px;
    background:var(--card); border:1.5px solid var(--navy);
    color:var(--navy); font-weight:700; font-size:14.5px;
  }

  /* Der Rahmen mit der Unterschrift. Gestrichelt, damit auch der leere
     Zustand erkennbar ein Feld ist und nicht wie ein Fehler aussieht. */
  .pr-unterschrift{
    border:1.5px dashed var(--border); border-radius:14px;
    background:#fafbfb; min-height:130px; margin-bottom:12px;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  .pr-unterschrift img{ max-width:100%; max-height:130px; }
  .pr-unterschrift .leer{
    color:var(--text-dim); font-size:13px; text-align:center; line-height:1.5;
  }

  @media (min-width:1024px){
    .pr-flaeche{ padding:24px 32px 40px; }
    .pr-kopfkarte{
      flex-direction:row; align-items:center; text-align:left;
      gap:16px; padding:20px 24px;
    }
    .pr-kopfkarte .mitte{ flex:1; min-width:0; }
    .pr-rot, .pr-weiss{ width:auto; padding:0 26px; }
  }
</style>
</head>
<body data-bereich="">

  <div class="tr-kopf nur-desktop"><h1>Mein Profil</h1></div>

  <div class="br-kopf nur-mobil">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <a class="br-knopf pressable" href="start.html" aria-label="Zurück zur Startseite">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <div style="font-weight:700; font-size:17px;">Mein Profil</div>
    </div>
  </div>

  <div id="hinweis" hidden style="margin:12px 16px 0; background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

  <div class="pr-flaeche"><div id="inhalt"></div></div>

</html>
