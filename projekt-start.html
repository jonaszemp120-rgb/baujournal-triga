<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projekt · Baujournal · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-bereich="baujournal">
<div class="screen">

  <div class="topbar" style="display:flex; align-items:center; gap:12px;">
    <a href="projekte.html" aria-label="Zurück" class="pressable bj-ikon" style="width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,0.08); flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div style="min-width:0; flex:1;">
      <div id="p-name" class="bj-h1" style="font-size:15.5px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">…</div>
      <div id="p-standort" class="bj-sub" style="font-size:11.5px; color:rgba(255,255,255,0.55); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
    </div>
    <a id="p-edit" href="#" aria-label="Projektangaben bearbeiten" class="pressable bj-ikon" style="width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
    </a>
  </div>

  <div class="scroll schmal" style="padding:18px 18px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px;">

    <a id="neu" href="#" class="btn-primary pressable" style="display:flex; align-items:center; justify-content:center; gap:9px; height:58px; border-radius:14px; background:#b20000; color:#fff; font-weight:700; font-size:16px; box-shadow:0 10px 24px rgba(178,0,0,0.28);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Neues Baujournal
    </a>

    <div id="hinweis" hidden style="background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
        <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000;">Abgeschlossene Einträge</div>
        <button id="v-filter" type="button" style="border:none; background:none; padding:0; display:flex; align-items:center;" aria-label="Einträge durchsuchen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa5a8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>

      <div id="v-suchzeile" hidden style="margin-bottom:10px; display:flex; flex-direction:column; gap:8px;">
        <input id="v-suche" type="search" placeholder="Nach Text, Wetter oder Ersteller suchen …" style="height:40px; border-radius:10px; border:1.5px solid var(--border); padding:0 12px; font-size:13.5px; color:var(--text); box-sizing:border-box;">
        <div style="display:flex; gap:8px; align-items:center;">
          <span style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); flex-shrink:0;">von</span>
          <input id="v-von" type="date" aria-label="Zeitraum von" style="flex:1; min-width:0; height:40px; border-radius:10px; border:1.5px solid var(--border); padding:0 10px; font-size:13px; color:var(--text); box-sizing:border-box;">
          <span style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); flex-shrink:0;">bis</span>
          <input id="v-bis" type="date" aria-label="Zeitraum bis" style="flex:1; min-width:0; height:40px; border-radius:10px; border:1.5px solid var(--border); padding:0 10px; font-size:13px; color:var(--text); box-sizing:border-box;">
        </div>
        <div style="display:flex; gap:8px;">
          <button id="v-pdf" type="button" class="pressable" style="flex:1; height:40px; border-radius:10px; border:1.5px solid var(--border); background:var(--card); color:var(--navy); font-size:12.5px; font-weight:700;">Auswahl als PDF</button>
          <button id="v-word" type="button" class="pressable" style="flex:1; height:40px; border-radius:10px; border:1.5px solid var(--border); background:var(--card); color:var(--navy); font-size:12.5px; font-weight:700;">Auswahl als Word</button>
        </div>
      </div>

      <div id="liste"></div>

      <a id="papierkorb" href="#" class="pressable" style="display:flex; align-items:center; justify-content:center; gap:7px; margin-top:14px; padding-top:13px; border-top:1px dashed var(--border);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9aa5a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        <span id="papierkorb-text" style="font-size:12px; font-weight:600; color:var(--text-dim);">Papierkorb</span>
      </a>
    </div>

  </div>

</div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/export.js"></script>
<script src="js/verlauf.js"></script>
<script src="js/projekt-start.js"></script>
</body>
</html>
