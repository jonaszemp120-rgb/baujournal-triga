<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projekt · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/projekte.css">
</head>
<body data-bereich="projekte">

  <div class="tr-kopf nur-desktop">
    <div class="pj-titel">
      <a href="projekte-bereich.html" class="br-knopf" aria-label="Zurück zur Projektliste">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <h1 id="d-name">…</h1>
      <span id="d-status"></span>
    </div>
    <div class="br-werkzeuge" id="d-werkzeuge"></div>
  </div>

  <div class="br-kopf nur-mobil">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <a href="projekte-bereich.html" class="br-knopf pressable" aria-label="Zurück zur Projektliste">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <div id="m-name" style="font-weight:700; font-size:17px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">…</div>
    </div>
    <div class="br-werkzeuge" id="m-werkzeuge"></div>
  </div>

  <div id="hinweis" hidden style="margin:12px 16px 0; background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

  <!-- Die Reihenfolge im Markup ist die des Handys. Auf dem Desktop
       verteilt CSS dieselben Blöcke auf zwei Spalten. -->
  <div class="pj-spalten">
    <div class="pj-links">
      <div id="stammdaten" class="pj-block"></div>
      <div id="personen" class="pj-block"></div>
      <div id="dokumente" class="pj-block"></div>
    </div>
    <div class="pj-rechts">
      <div id="unternehmer" class="pj-block"></div>
      <div id="journal" class="pj-block"></div>
    </div>
  </div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/projekte-daten.js"></script>
<script src="js/projekt-detail.js"></script>
</body>
</html>
