<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dokumente · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/projekte.css">
<style>
  .dk-ordnerzeile{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:9px 8px 9px 12px; border-radius:9px;
    background:transparent; border:none; text-align:left; color:var(--text);
  }
  .dk-ordnerzeile:hover{ background:var(--bg); }
  .dk-ordnerzeile[aria-current="true"]{ background:var(--bg); }
  .dk-ordnerzeile[aria-current="true"] .name{ font-weight:700; }
  .dk-ordnerzeile .symbol{ color:var(--navy); display:flex; flex-shrink:0; }
  .dk-ordnerzeile .name{ font-size:13.5px; font-weight:500; flex:1; min-width:0; overflow-wrap:anywhere; }
  /* Gehört der Ordner zu einem Projekt, steht es klein darunter. */
  .dk-projekt{
    display:block; margin-top:2px; font-size:11px; font-weight:600;
    color:var(--text-dim); overflow-wrap:anywhere;
  }
  .dk-mini{
    width:26px; height:26px; border-radius:6px; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;
  }
  .dk-mini:hover{ background:#e3e8ea; }
  .dk-mini.rot{ color:var(--red); }

  .dk-tabelle{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .dk-datei{ display:flex; align-items:center; gap:14px; padding:13px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .dk-datei:last-child{ border-bottom:none; }
  .dk-datei .pdf{
    width:36px; height:36px; border-radius:9px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; color:var(--red-dark); flex-shrink:0;
  }
  .dk-datei .dname{ flex:1; min-width:0; font-weight:600; font-size:14px; overflow-wrap:anywhere; }
  .dk-datei .meta{ color:var(--text-dim); font-size:12.5px; }
  .dk-datei .knoepfe{ display:flex; gap:8px; flex-shrink:0; }
  .dk-datei .knoepfe button{
    width:32px; height:32px; border-radius:8px; border:none; background:var(--bg);
    display:flex; align-items:center; justify-content:center; color:var(--navy);
  }
  .dk-datei .knoepfe button.rot{ color:var(--red); }
  .dk-datei .knoepfe button:hover{ background:#e3e8ea; }

  .dk-pfad{ padding:14px 16px 4px; color:var(--text-dim); font-size:12.5px; }
  .dk-hoch{
    height:42px; padding:0 18px; border-radius:10px; border:none;
    background:var(--red); color:#fff; font-weight:700; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .dk-hoch:active{ background:var(--red-dark); }

  /* Handy: entweder die Ordner oder der Inhalt eines Ordners. */
  @media (max-width:1023px){
    .dk[data-offen="1"] .br-liste{ display:none; }
    .dk[data-offen="0"] .br-detail{ display:none !important; }
    .dk[data-offen="1"] .br-detail{ display:block; padding:0 0 24px; }
    .dk-datei{ gap:6px 14px; }
    .dk-datei .dname{ flex-basis:calc(100% - 50px); }
    .dk-datei .knoepfe{ margin-left:auto; }
  }
  @media (min-width:1024px){
    .dk-pfad{ display:none; }
    /* Der Dateiname braucht den Platz, die Angaben daneben nicht. Ohne
       eine Mindestbreite quetscht flex ihn auf ein paar Zeichen. */
    .dk-datei .dname{ flex:1 1 240px; }
    .dk-datei .wann{ width:100px; flex-shrink:0; }
    .dk-datei .wer{ width:130px; flex-shrink:0; }
    .dk-datei .gross{ width:70px; flex-shrink:0; text-align:right; }
    .dk-datei{ flex-wrap:nowrap; }
    /* Der Detailbereich bringt seinen Abstand schon mit. */
    .dk-kopfzeile{ padding:0 !important; }
    .dk-flaeche{ padding:0 !important; }
  }
</style>
</head>
<body data-bereich="dokumente">

  <div class="tr-kopf nur-desktop">
    <h1>Dokumente</h1>
    <div class="br-werkzeuge">
      <a class="br-knopf" href="papierkorb-bereich.html?bereich=ordner" aria-label="Papierkorb">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </a>
    </div>
  </div>

  <div class="br-kopf nur-mobil">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <a id="m-zurueck" href="start.html" class="br-knopf pressable" aria-label="Zurück">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <div id="m-titel" style="font-weight:700; font-size:17px;">Dokumente</div>
    </div>
    <div class="br-werkzeuge">
      <a class="br-knopf pressable" href="papierkorb-bereich.html?bereich=ordner" aria-label="Papierkorb">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </a>
      <button type="button" id="m-neu" class="br-knopf pressable" aria-label="Ordner anlegen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div id="hinweis" hidden style="margin:12px 16px 0; background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

  <div id="dk" class="br-layout dk" data-offen="0">
    <div class="br-liste">
      <div id="pfad" class="dk-pfad">Dokumente /</div>
      <div style="padding:10px 12px 0;">
        <button type="button" id="d-neu" class="pressable nur-desktop" style="display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; border:none; border-radius:10px; background:var(--navy); color:#fff; font-weight:700; font-size:13.5px;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Ordner anlegen</span>
        </button>
      </div>
      <div id="ordner" class="inhalt" style="padding-top:10px;"></div>
      <div id="letzte" class="nur-mobil" style="padding:0 16px 24px;"></div>
    </div>

    <div id="detail" class="br-detail"></div>
  </div>

  <input id="datei-wahl" type="file" accept="application/pdf,.pdf" hidden>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/projekte-daten.js"></script>
<script src="js/dokumente.js"></script>
</body>
</html>
