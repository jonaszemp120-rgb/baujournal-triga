<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sitzungsprotokolle · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/projekte.css">
<link rel="stylesheet" href="css/protokoll.css">
</head>
<body data-bereich="projekte">

  <div class="tr-kopf nur-desktop">
    <div class="pj-titel">
      <a id="d-zurueck" href="projekte-bereich.html" class="br-knopf" aria-label="Zurück zum Projekt">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <h1 id="d-titel">Sitzungsprotokolle</h1>
    </div>
    <div class="br-werkzeuge" id="d-werkzeuge"></div>
  </div>

  <div class="br-kopf nur-mobil">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <a id="m-zurueck" href="projekte-bereich.html" class="br-knopf pressable" aria-label="Zurück">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <div id="m-titel" style="font-weight:700; font-size:17px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Protokolle</div>
    </div>
  </div>

  <div id="hinweis" hidden style="margin:12px 16px 0; background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

  <!-- Ein Feld über alle Protokolle des Projekts. Es steht über der Liste
       und nicht in der Kopfzeile: gesucht wird hier drin und nirgends
       sonst, und die globale Suche sitzt schon in der Seitenleiste. -->
  <div class="pk-suche" id="suchleiste" hidden>
    <input id="p-suche" type="search" placeholder="In allen Protokollen suchen…"
           aria-label="In allen Protokollen dieses Projekts suchen">
  </div>

  <div id="inhalt" class="pk-flaeche"></div>

  <!-- Auf dem Handy liegt der Knopf unten fest, auf dem Desktop steht er
       oben rechts in der Kopfzeile. -->
  <div class="pj-fussleiste nur-mobil">
    <button type="button" id="m-neu" class="pressable">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Neues Protokoll
    </button>
  </div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/projekte-daten.js"></script>
<script src="js/protokolle.js"></script>
</body>
</html>
