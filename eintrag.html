<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eintrag · Baujournal · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<style>
  .karte{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px; }
  .kartentitel{ font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#b20000; margin-bottom:10px; }
  .werttext{ font-size:14px; color:var(--text); line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
  .werttext.leer{ color:var(--text-dim); font-style:italic; }
  .feld{ width:100%; border-radius:10px; border:1.5px solid var(--border); padding:11px 13px; font-size:14px; color:var(--text); box-sizing:border-box; resize:vertical; min-height:64px; }
  /* In der Leseansicht sind die Kontrollpunkte nur Anzeige, nicht klickbar. */
  #inhalt[data-modus="lesen"] .kp{ cursor:default; }
</style>
</head>
<body data-bereich="baujournal">
<div class="screen">

  <div class="topbar" style="display:flex; align-items:center; gap:12px;">
    <a id="zurueck" href="projekte.html" aria-label="Zurück" class="pressable bj-ikon" style="width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,0.08); flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div style="min-width:0; flex:1;">
      <div id="k-titel" class="bj-h1" style="font-size:15.5px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">…</div>
      <div id="k-sub" class="bj-sub" style="font-size:11.5px; color:rgba(255,255,255,0.55); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
    </div>
    <button id="stift" class="pressable bj-ikon" aria-label="Eintrag korrigieren" style="width:34px; height:34px; border:none; border-radius:10px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
    </button>
  </div>

  <div id="inhalt" class="scroll zweispaltig" data-modus="lesen" style="padding:18px 18px 24px; display:flex; flex-direction:column; gap:14px;"></div>

  <div id="aktionen" class="actionbar" style="display:flex; gap:10px;"></div>

</div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/export.js"></script>
<script src="js/eintrag.js"></script>
</body>
</html>
