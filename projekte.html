<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baujournal · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-bereich="baujournal">
<div class="screen noch-mobil">

  <!-- top bar -->
  <div class="topbar" style="--rand:20px; display:flex; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <a href="start.html" class="pressable nur-mobil" aria-label="Zur Startseite" style="width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,0.08); flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div data-logo="20"></div>
    </div>
    <button id="konto" class="pressable" aria-label="Konto" style="width:32px; height:32px; border:none; border-radius:999px; background:#b20000; color:#fff; font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; letter-spacing:0.02em;">–</button>
  </div>

  <div style="padding:20px 20px 10px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;">
    <div style="min-width:0;">
      <div id="titel" style="font-size:22px; font-weight:900; color:var(--navy); letter-spacing:-0.01em;">Projekte</div>
      <div id="unterzeile" style="font-size:13px; color:var(--text-dim); margin-top:2px;">wird geladen …</div>
    </div>
    <button id="filter" class="pressable" style="flex-shrink:0; border:1.5px solid var(--border); background:var(--card); border-radius:999px; padding:7px 13px; font-size:12px; font-weight:700; color:var(--text-dim); letter-spacing:0.02em;">Archiv</button>
  </div>

  <!-- search -->
  <div style="padding:6px 20px 14px;">
    <div class="searchwrap" style="display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--border); border-radius:12px; height:44px; padding:0 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa5a8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="suche" type="search" placeholder="Projekt suchen …" style="border:none; outline:none; background:transparent; font-size:14px; color:var(--text); flex:1; min-width:0;">
    </div>
  </div>

  <div id="hinweis" hidden style="margin:0 20px 12px; background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

  <!-- project list -->
  <div id="liste" class="scroll" style="padding:4px 20px 0; display:flex; flex-direction:column; gap:12px;"></div>

  <!-- bottom action -->
  <div class="actionbar" style="--rand:20px;">
    <a href="projekt.html" class="btn-primary pressable" style="display:flex; align-items:center; justify-content:center; gap:8px; height:52px; border-radius:14px; background:#b20000; color:#fff; font-weight:700; font-size:15px; box-shadow:0 10px 24px rgba(178,0,0,0.28);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Neues Projekt
    </a>
  </div>

</div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/projekte.js"></script>
</body>
</html>
