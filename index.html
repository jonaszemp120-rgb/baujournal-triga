<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<style>
  html, body{ background:var(--navy); }
</style>
</head>
<body class="dark">

<div style="min-height:100dvh; box-sizing:border-box; position:relative; overflow:hidden; background:var(--navy); display:flex; flex-direction:column;">

  <!-- brand bracket motif, echoes the TRIGA mark -->
  <div style="position:absolute; top:96px; left:-40px; width:120px; height:14px; background:var(--red); transform:skewY(-9deg); border-radius:3px; opacity:0.9;"></div>
  <div style="position:absolute; top:150px; left:-52px; width:150px; height:14px; background:#ffffff; transform:skewY(3deg); border-radius:3px; opacity:0.14;"></div>
  <div style="position:absolute; top:204px; left:-40px; width:120px; height:14px; background:var(--red); transform:skewY(9deg); border-radius:3px; opacity:0.9;"></div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:28px; position:relative; z-index:2; padding:calc(32px + env(safe-area-inset-top)) calc(32px + env(safe-area-inset-right)) 32px calc(32px + env(safe-area-inset-left));">

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <div data-logo="34"></div>
      <div style="width:36px; height:2px; background:#b20000; border-radius:2px;"></div>
    </div>

    <form id="form" style="width:100%; max-width:326px; background:var(--card); border-radius:20px; padding:32px 26px 28px; box-sizing:border-box; box-shadow:0 24px 48px rgba(0,10,20,0.35); display:flex; flex-direction:column; gap:22px;">

      <div style="display:flex; flex-direction:column; gap:4px;">
        <div style="font-size:24px; font-weight:900; color:var(--navy); letter-spacing:-0.01em;">Anmelden</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="email" style="font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);">E-Mail</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="vorname.nachname@triga.ch" style="height:46px; border-radius:11px; border:1.5px solid var(--border); padding:0 14px; font-size:14.5px; color:var(--text); box-sizing:border-box;">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label for="pw" style="font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);">Passwort</label>
          <input id="pw" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" style="height:46px; border-radius:11px; border:1.5px solid var(--border); padding:0 14px; font-size:14.5px; color:var(--text); box-sizing:border-box;">
        </div>
      </div>

      <div id="fehler" hidden style="font-size:12.5px; color:var(--red); font-weight:600; line-height:1.45; margin-top:-8px;"></div>

      <button id="btn" type="submit" class="btn-primary pressable" style="display:flex; align-items:center; justify-content:center; gap:10px; height:50px; border:none; border-radius:12px; background:#b20000; color:#ffffff; font-weight:700; font-size:15px; letter-spacing:0.01em;">
        Anmelden
      </button>

      <div style="font-size:11.5px; color:var(--text-dim); text-align:center; line-height:1.5;">
        Zugang nur für Teammitglieder.<br>Konto wird intern eingerichtet.
      </div>
    </form>

  </div>

  <div style="text-align:center; padding:0 0 calc(28px + env(safe-area-inset-bottom)); font-size:11px; color:rgba(255,255,255,0.45); font-weight:500; letter-spacing:0.03em;">
    Erfolgreiches Bauen
  </div>

</div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  // Wer schon angemeldet ist, landet direkt auf der Startseite.
  if (await session()) { location.replace('start.html'); return; }

  const form = $('#form'), btn = $('#btn'), fehler = $('#fehler');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    fehler.hidden = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>';

    const { error } = await sb.auth.signInWithPassword({
      email: $('#email').value.trim(),
      password: $('#pw').value
    });

    if (error) {
      // Supabase meldet englisch, fuer die Baustelle reicht Klartext.
      fehler.textContent = /invalid/i.test(error.message)
        ? 'E-Mail oder Passwort stimmt nicht.'
        : (navigator.onLine ? error.message : 'Keine Verbindung. Für die erste Anmeldung braucht es Netz.');
      fehler.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      return;
    }
    location.replace('start.html');
  });
})();
</script>
</body>
</html>
