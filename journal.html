<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rundgang · Baujournal · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-bereich="baujournal">
<div class="screen">

  <!-- top bar -->
  <div class="topbar" style="display:flex; align-items:center; gap:12px;">
    <a id="zurueck" href="projekte.html" aria-label="Zurück" class="pressable bj-ikon" style="width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,0.08); flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div style="min-width:0; flex:1;">
      <div id="p-name" class="bj-h1" style="font-size:15.5px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">…</div>
      <div id="p-standort" class="bj-sub" style="font-size:11.5px; color:rgba(255,255,255,0.55); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
    </div>
    <a id="p-edit" href="#" aria-label="Projektangaben bearbeiten" class="pressable bj-ikon" style="width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
    </a>
  </div>

  <div class="scroll zweispaltig" style="padding:18px 18px 24px; display:flex; flex-direction:column; gap:14px;">

    <!-- Rundgang meta -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px;">
        <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000;">Rundgang</div>
        <div style="display:flex; align-items:center; gap:5px;">
          <div id="netz-punkt" style="width:7px; height:7px; border-radius:999px; background:var(--ok);"></div>
          <div id="netz-text" style="font-size:11px; font-weight:600; color:var(--text-dim);">Online</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <div style="min-width:0;">
          <label for="f-datum" style="font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; display:block;">Datum</label>
          <div style="position:relative; display:inline-flex; align-items:center; gap:7px;">
            <span id="datum-text" style="font-size:16px; font-weight:700; color:var(--text); margin-top:2px;">–</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa5a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <input id="f-datum" type="date" aria-label="Datum des Rundgangs" style="position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; padding:0; margin:0;">
          </div>
        </div>
        <div style="text-align:right; min-width:0;">
          <div style="font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;">Bauleiter</div>
          <div id="f-bauleiter" style="font-size:16px; font-weight:700; color:var(--text); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">…</div>
        </div>
      </div>
      <button id="uebernehmen" type="button" style="width:100%; margin-top:14px; padding-top:12px; border:none; border-top:1px dashed var(--border); background:none; display:flex; align-items:center; justify-content:center; gap:7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b20000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span style="font-size:12.5px; font-weight:700; color:#b20000;">Angaben von letztem Eintrag übernehmen</span>
      </button>
    </div>

    <!-- Wetter -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
        <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000;">Wetter</div>
        <button type="button" id="wetter-jetzt" class="wt-knopf pressable">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/><path d="M12 1v3M12 20v3M23 12h-3M4 12H1"/></svg>
          <span>Wetter jetzt abrufen</span>
        </button>
      </div>
      <div id="wetter" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;"></div>
      <div id="temperatur" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
      <div id="wetter-hinweis" class="wt-hinweis" hidden role="status"></div>
    </div>

    <!-- Kontrolle -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;">
        <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000;">Allgemeine Kontrolle</div>
        <div id="kp-stand" style="font-size:12px; font-weight:700; color:var(--text-dim);">0/0</div>
      </div>
      <div id="kontrolle"></div>
    </div>

    <!-- Firmen -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000; margin-bottom:10px;">Firmen / Mannschaft vor Ort</div>
      <textarea id="f-firmen" placeholder="Welche Unternehmer mit wie vielen Leuten …" style="width:100%; min-height:64px; border-radius:10px; border:1.5px solid var(--border); padding:11px 13px; font-size:14px; color:var(--text); box-sizing:border-box; resize:vertical;"></textarea>
    </div>

    <!-- Betrifft, nur wenn das Projekt Gebäude führt -->
    <div id="betrifft-karte" hidden style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000; margin-bottom:12px;">Betrifft</div>
      <div id="betrifft" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>

    <!-- Baufortschritt -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000; margin-bottom:10px;">Baufortschritt</div>
      <textarea id="f-fortschritt" placeholder="Welche Arbeiten sind heute gelaufen …" style="width:100%; min-height:80px; border-radius:10px; border:1.5px solid var(--border); padding:11px 13px; font-size:14px; color:var(--text); box-sizing:border-box; resize:vertical;"></textarea>
    </div>

    <!-- Feststellungen -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000; margin-bottom:10px;">Feststellungen / Mängel</div>
      <textarea id="f-feststellungen" placeholder="Abweichungen, Mängel, Schäden, besondere Vorkommnisse …" style="width:100%; min-height:64px; border-radius:10px; border:1.5px solid var(--border); padding:11px 13px; font-size:14px; color:var(--text); box-sizing:border-box; resize:vertical;"></textarea>
    </div>

    <!-- Anweisungen -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px;">
      <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#b20000; margin-bottom:10px;">Erteilte Anweisungen</div>
      <textarea id="f-anweisungen" placeholder="Mündliche Anweisungen an Unternehmer vor Ort …" style="width:100%; min-height:64px; border-radius:10px; border:1.5px solid var(--border); padding:11px 13px; font-size:14px; color:var(--text); box-sizing:border-box; resize:vertical;"></textarea>
    </div>

    <!-- Fotos hint -->
    <div id="fotos" class="kp hinweis" data-ok="0" role="checkbox" aria-checked="false" tabindex="0" style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px; gap:12px;">
      <div class="box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9aa5a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <div class="label" style="font-size:13.5px; font-weight:500;">Fotos gemacht, separat auf Server ablegen</div>
      </div>
    </div>

  </div>

  <!-- sticky save bar -->
  <div class="actionbar" style="display:flex; gap:10px;">
    <button id="sync" type="button" class="pressable" aria-label="Übertragungsstatus" style="position:relative; flex-shrink:0; width:52px; height:52px; border-radius:14px; background:var(--card); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span id="sync-zahl" hidden style="position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; border-radius:999px; background:var(--red); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 5px; box-sizing:border-box;"></span>
    </button>
    <button id="speichern" type="button" class="btn-primary pressable" style="flex:1; display:flex; align-items:center; justify-content:center; height:52px; border:none; border-radius:14px; background:#b20000; color:#fff; font-weight:700; font-size:15px; box-shadow:0 10px 24px rgba(178,0,0,0.28);">
      Eintrag speichern
    </button>
  </div>

</div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/wetter.js"></script>
<script src="js/journal.js"></script>
</body>
</html>
