<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suche · TRIGA App</title>
<meta name="theme-color" content="#00233f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRIGA">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/projekte.css">
<style>
  /* Die Suchleiste steht dort, wo sonst der Seitentitel steht: gesucht
     wird über alle Bereiche, sie gehört also zu keinem. */
  .su-leiste{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .su-feld{
    display:flex; align-items:center; gap:10px; flex:1; min-width:0;
    height:42px; padding:0 14px; border-radius:11px;
    background:var(--bg); color:var(--text-dim);
  }
  .su-feld input{
    flex:1; min-width:0; height:100%; border:none; background:none;
    font-size:14.5px; color:var(--text);
  }
  .su-feld input:focus{ outline:none; }

  .su-flaeche{ padding:16px 16px 28px; }
  .su-gruppe{
    margin:0 0 10px; font-size:11.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text-dim);
  }
  .su-gruppe + .su-liste{ margin-bottom:22px; }
  .su-treffer{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-bottom:1px solid var(--border); color:var(--text);
  }
  .su-treffer:last-child{ border-bottom:none; }
  .su-treffer:hover{ background:var(--bg); }
  .su-treffer .symbol{
    width:34px; height:34px; border-radius:9px; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    color:var(--navy); flex-shrink:0;
  }
  .su-treffer .wer{ flex:1; min-width:0; }
  .su-treffer .titel{ display:block; font-weight:700; font-size:14px; overflow-wrap:anywhere; }
  .su-treffer .unter{ display:block; color:var(--text-dim); font-size:12px; overflow-wrap:anywhere; }
  .su-liste{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }

  @media (min-width:1024px){
    .su-flaeche{ padding:24px 32px 40px; max-width:1000px; }
    .su-feld{ max-width:520px; }
  }
</style>
</head>
<body data-bereich="">

  <div class="tr-kopf nur-desktop">
    <div class="su-leiste">
      <form class="su-feld" id="d-form" role="search">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="d-q" type="search" name="q" placeholder="Projekte, Firmen, Mitarbeiter, Dokumente" aria-label="Alles durchsuchen">
      </form>
    </div>
  </div>

  <div class="br-kopf nur-mobil">
    <a href="start.html" class="br-knopf pressable" aria-label="Zur Startseite">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <form class="su-feld" id="m-form" role="search">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="m-q" type="search" name="q" placeholder="Alles durchsuchen" aria-label="Alles durchsuchen">
    </form>
  </div>

  <div id="hinweis" hidden style="margin:12px 16px 0; background:rgba(178,0,0,0.06); border:1px solid rgba(178,0,0,0.18); border-radius:12px; padding:11px 14px; font-size:12.5px; font-weight:600; color:var(--red); line-height:1.45;"></div>

  <div class="su-flaeche"><div id="ergebnis"></div></div>

<script src="vendor/supabase-js-2.58.0.js"></script>
<script src="js/logo.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="js/projekte-daten.js"></script>
<script src="js/suche.js"></script>
</body>
</html>
